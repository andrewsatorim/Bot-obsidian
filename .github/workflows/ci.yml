name: CI

# Run on BOTH main and develop. Stage 6 lived on develop and never hit CI
# because the old config only watched main — which is exactly why untracked
# files (a missing notifier.py / isolation test) slipped through to origin.
# actions/checkout produces a CLEAN clone, so anything not committed simply does
# not exist in the job and the build fails. The `test` job below is that guard.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # The real guard: a clean clone + uv + the ENTIRE test suite, isolation first.
  # This is what catches "works on my disk but not in git" situations.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # setup-uv ignores python-version; pin the interpreter on uv venv instead
      # (uv fetches a managed CPython 3.11 — the project's minimum supported).
      - run: uv venv --python 3.11
      - run: uv pip install ".[dev]"
      # Isolation test on its own first, so a signal-engine boundary breach is
      # unmistakable in the logs (forward + reverse import-graph invariants).
      - name: Signal-engine isolation
        run: uv run pytest tests/test_signal_engine_isolation.py -v
      # Then the whole suite. On a clean clone a missing-but-imported file fails
      # here loudly — exactly the Stage 6.1 situation we want CI to catch.
      - name: Full test suite
        run: uv run pytest tests/ -v --cov=app --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # Lint: new code is held strictly green; the legacy style debt across the rest
  # of the repo is REPORTED but non-blocking (continue-on-error) so it surfaces
  # without falsely failing unrelated work. Pay it down separately, not here.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # setup-uv ignores python-version; pin the interpreter on uv venv instead
      # (uv fetches a managed CPython 3.11 — the project's minimum supported).
      - run: uv venv --python 3.11
      - run: uv pip install ruff
      - name: Lint new code (strict)
        run: >-
          uv run ruff check
          app/signal_engine/
          scripts/run_signal_engine.py
          tests/test_signal_engine_isolation.py
          tests/test_signal_engine_setups.py
          tests/test_signal_engine_risk.py
      - name: Lint full repo (legacy debt, non-blocking)
        continue-on-error: true
        run: uv run ruff check app/ tests/ scripts/

  # ---------------------------------------------------------------------------
  # Typecheck: same philosophy — strict on new code, informational elsewhere.
  # ---------------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # setup-uv ignores python-version; pin the interpreter on uv venv instead
      # (uv fetches a managed CPython 3.11 — the project's minimum supported).
      - run: uv venv --python 3.11
      - run: uv pip install ".[dev]"
      - name: Typecheck new code (strict)
        run: uv run mypy app/signal_engine/ --ignore-missing-imports
      - name: Typecheck full app (legacy debt, non-blocking)
        continue-on-error: true
        run: uv run mypy app/ --ignore-missing-imports

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bot-obsidian:test .
